<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='detail.css') }}">
    <title>상세정보</title>
</head>
<body>
    <div class="container">
        <div class="title">식재료 추천</div>
        <div class="subtitle">비장에 좋은<span class="highlight">식재료</span>로 비장 건강을 관리해요</div>

        <div class="box-contanier">
            <div class="content-box">
                <div class="title-container">
                    <div class="recommendation-title">추천 식재료 1</div> 
                    <div class="recipe-button"></div>
                </div>
                <div class="ingredient-container">
                    <div class="image-wrapper">
                        <div class="Rectangle35"></div> 
                        <img class="ingredient-image" src="https://github.com/NIS-co-create/acne-CV/blob/main/app_image/%EC%8B%9C%EA%B8%88%EC%B9%98.png?raw=true" alt="시굼치"> <!-- 이미지 -->
                    </div>
                    <div class="ingredient-text">
                        <div class="ingredient-name">시금치</div>
                        <div class="ingredient-description">
                            시금치와 같은 녹색 잎채소는<span class="highlight">철분</span>이 풍부해서<br>
                            비장의 적혈구 생성 기능을 도와줘요
                        </div>
                    </div>
                </div>
            </div> 
            <div class="content-box">
                <div class="title-container">
                    <div class="recommendation-title">추천 식재료 2</div>
                    <div class="recipe-button"></div> 
                </div>
                <div class="ingredient-container">
                    <div class="image-wrapper">
                        <div class="Rectangle35"></div> <!-- 배경 -->
                        <img class="ingredient-image" src="https://github.com/NIS-co-create/acne-CV/blob/main/app_image/%EA%B0%95%ED%99%A9.png?raw=true" alt="강황"> <!-- 이미지 -->
                    </div>
                    <div class="ingredient-text">
                        <div class="ingredient-name">강황</div>
                        <div class="ingredient-description">
                            강황의 <span class="highlight">커큐민</span>은 비장의<br>
                            염증을 줄여주고 기능을 향상시켜주는<br> 
                            항염증 화합물이 많아요
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="warning-title">유의 사항</div>
        <div class="warning-text">일상 생활 속 비장 건강을 위한 <span class="highlight">유의 사항</span>이에요</div>
        <div class="box-contanier">
            <div class="content-box">
                <div class="warning-details">
                    <span class="warning-highlight">고당류</span>섭취를 피하세요<br>
                    <span class="warning-highlight">카페인</span>섭취를 줄여보세요<br>
                </div>
            </div>
        </div>

        <div class="nav-arrows">
            <div class="Polygon3" id="goToResult">
                <svg width="20" height="22" viewBox="0 0 20 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1.5 8.40193C-0.500003 9.55663 -0.5 12.4434 1.5 13.5981L15 21.3923C17 22.547 19.5 21.1036 19.5 18.7942V3.20577C19.5 0.896367 17 -0.547005 15 0.607695L1.5 8.40193Z" fill="#595F67"/>
                </svg>
            </div>
            <div class="Polygon2">
                <svg width="20" height="22" viewBox="0 0 20 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.5 8.40193C20.5 9.55663 20.5 12.4434 18.5 13.5981L5 21.3923C3 22.547 0.5 21.1036 0.5 18.7942V3.20577C0.5 0.896367 3 -0.547005 5 0.607695L18.5 8.40193Z" fill="#D9D9D9"/>
                </svg>
            </div>
        </div>

        <button class="save-button" id="save-button">저장하기</button>
    </div>
        <script>
        document.getElementById("goToResult").addEventListener("click", function() {
            window.location.href = "/rightcheek";
        });

        document.getElementById("save-button").addEventListener("click", function() {
            var results = {
                total_acne_count: "{{ results.total_acne_count }}",
                max_acne_part: "{{ results.max_acne_part }}"
            };

            fetch("/save_result", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(results)
            })
            .then(response => response.json())
            .then(data => { alert("✅ 저장되었습니다!"); })
            .catch(error => { alert("❌ 저장 실패!"); });
        });
    </script>
</body>
</html>
