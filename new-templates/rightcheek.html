<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, initial-scale=1.0">
    <title>결과 화면</title>
    <<link rel="stylesheet" href="{{ url_for('static', filename='result.css') }}">
</head>
<body>
    <div class="container">
        <button class="back-button" onclick="history.back();">
            <img src="{{ url_for('static', filename='images/back.svg') }}" alt="뒤로가기">
        </button>

        <div class="title">분석결과</div>
        <div class="subtitle"><span class="highlight">폐</span> 건강 관리가 필요해요</div>
        <div class="user-text">{{ results.max_acne_part }}에 뾰루지가 났어요</div>
        <img src="https://github.com/NIS-co-create/acne-CV/blob/main/app_image/%EC%8A%AC%ED%9D%AC/oreunboll.png?raw=true" class="face-image"></img>
        <div class="description-box">
            <div class="detail-title">상세설명</div>
            <div class="description-text">
                <b>한의학</b>에서는 얼굴을 통해<br>
                신체 장기 상태를 알 수 있어요<br>
                <b>{{ results.max_acne_part }}</b>은(는) <span class="highlight"><b>폐</b></span>가 안 좋은 걸 뜻해요<br>
                폐에 좋은 식재료와 유의 사항을 소개해 드릴게요
            </div>
        </div>

        <div class="nav-arrows">
            <div class="Polygon3">
                <svg width="20" height="22" viewBox="0 0 20 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1.5 8.40193C-0.500003 9.55663 -0.5 12.4434 1.5 13.5981L15 21.3923C17 22.547 19.5 21.1036 19.5 18.7942V3.20577C19.5 0.896367 17 -0.547005 15 0.607695L1.5 8.40193Z" fill="#D9D9D9"/>
                </svg>
            </div>
            <div class="Polygon2">
                <svg width="20" height="22" viewBox="0 0 20 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.5 8.40193C20.5 9.55663 20.5 12.4434 18.5 13.5981L5 21.3923C3 22.547 0.5 21.1036 0.5 18.7942V3.20577C0.5 0.896367 3 -0.547005 5 0.607695L18.5 8.40193Z" fill="#595F67"/>
                </svg>
            </div>
        </div>

        <button class="save-button" id="save-button">저장하기</button>
    </div>

    <script>
        document.getElementById("save-button").addEventListener("click", function() {
            var results = {
                total_acne_count: "{{ results.total_acne_count }}",
                max_acne_part: "{{ results.max_acne_part }}"
            };

            fetch("/save_result", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(results)
            })
            .then(response => response.json())
            .then(data => { alert("✅ 저장되었습니다!"); })
            .catch(error => { alert("❌ 저장 실패!"); });
        });
    </script>
</body>
</html>
